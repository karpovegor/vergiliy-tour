<div class="countries-section" style="padding: 80px 0; background-color: #f8f9fa;">
    <div style="width: 90%; max-width: 1400px; margin: 0 auto;">
        
        <h2 class="main-title" style="text-align: center; margin-bottom: 20px; font-size: 36px; color: #333;">Направления</h2>
        <p style="text-align: center; color: #666; margin-bottom: 60px; font-size: 18px;">Выберите страну, которая станет вашим следующим культурным открытием</p>
        
        <div class="countries-grid">
            
            <!-- Австрия -->
            <div class="country-card">
                <img src="imgs/flag-austria.jpg" alt="Австрия" class="flag-img">
                <h3>Австрия</h3>
            </div>

            <!-- Чехия -->
            <div class="country-card">
                <img src="imgs/flag-czech.jpg" alt="Чехия" class="flag-img">
                <h3>Чехия</h3>
            </div>

            <!-- Германия -->
            <div class="country-card">
                <img src="imgs/flag-germany.jpg" alt="Германия" class="flag-img">
                <h3>Германия</h3>
            </div>

            <!-- Англия -->
            <div class="country-card">
                <img src="imgs/flag-uk.jpg" alt="Англия" class="flag-img">
                <h3>Англия</h3>
            </div>

            <!-- США -->
            <div class="country-card">
                <img src="imgs/flag-usa.jpg" alt="США" class="flag-img">
                <h3>США</h3>
            </div>

        </div>
    </div>

<style>
    .countries-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr); /* 5 колонок в один ряд */
        gap: 20px;
    }

    .country-card {
        background: #fff;
        padding: 30px 20px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        border: 1px solid #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .country-card:hover {
        transform: translateY(-10px); /* Карточка всплывает вверх */
        box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        border-color: #007bff;
    }

    /* Стили для картинок флагов */
    .flag-img {
        width: 90px;          /* Ширина флага */
        height: 60px;         /* Высота флага */
        object-fit: cover;    /* Картинка заполняет блок без искажений */
        border-radius: 8px;   /* Закругляем края */
        box-shadow: 0 3px 8px rgba(0,0,0,0.15); /* Легкая тень для объема */
        margin-bottom: 20px;
        border: 1px solid #eee;
    }

    .country-card h3 {
        margin: 0;
        color: #333;
        font-size: 22px;
        font-weight: bold;
    }

    /* Адаптивность */
    @media (max-width: 1100px) {
        .countries-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
        .countries-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
        .countries-grid { grid-template-columns: 1fr; }
    }
</style>
<!-- End Countries -->
